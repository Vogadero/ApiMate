<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP placeholders are replaced at runtime by the extension host (UIManager):
        {{cspSource}}  → the webview's allowed resource origin (e.g. vscode-webview-resource:)
        {{nonce}}      → a per-load cryptographic nonce for inline scripts/styles
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src {{cspSource}} 'nonce-{{nonce}}'; font-src {{cspSource}}; img-src {{cspSource}} https: data:;"
    />
    <title>ApiMate</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      The nonce attribute is injected by the extension host at load time.
      The vscodeWebviewPlugin strips type="module" from this tag at build time
      so the IIFE bundle loads correctly under the webview CSP.
    -->
    <script type="module" nonce="{{nonce}}" src="/src/main.tsx"></script>
  </body>
</html>
